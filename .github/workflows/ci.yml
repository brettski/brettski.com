name: CI

# Required check for merging into main (see the ruleset on main). Cloudflare
# Workers Builds deploys main after the merge; this workflow never deploys.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job name is the status check name the ruleset requires.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@7
        with:
          persist-credentials: false
      - uses: actions/setup-node@7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
